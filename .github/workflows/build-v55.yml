name: Build SurveyQuant v1.0.55

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Project ZIP
        run: |
          echo "Checking project ZIP..."
          ls -lah
          test -f SurveyQuantAndroid_v1.0.55_TECHNICAL_OFFICE_MASTER.zip

      - name: Extract SurveyQuant Project
        run: |
          unzip -o SurveyQuantAndroid_v1.0.55_TECHNICAL_OFFICE_MASTER.zip
          cp -r SurveyQuantAndroid/. .

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Show Gradle Version
        run: |
          gradle --version

      - name: Clean Project
        run: |
          gradle clean --no-daemon

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          echo "APK successfully created:"
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SurveyQuant-v1.0.55-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
